<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>推送配置 - 监控系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="flex">
        <div class="w-64 bg-blue-900 text-white fixed left-0 top-0 min-h-screen">
            <div class="p-6 border-b border-blue-700">
                <h1 class="text-xl font-bold flex items-center">
                    <i class="fa fa-monitor mr-2"></i>监控系统
                </h1>
            </div>
            <nav class="p-4">
                <div class="space-y-2">
                    <a href="/" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-home mr-3"></i>首页统计
                    </a>
                    <a href="/push-records.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-bell mr-3"></i>推送记录
                    </a>
                    <a href="/sql-rules.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-list-alt mr-3"></i>SQL规则管理
                    </a>
                    <a href="/sql-upload.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-folder-open mr-3"></i>SQL文件维护
                    </a>
                    <a href="/sql-config.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-database mr-3"></i>SQL数据源配置
                    </a>
                    <a href="/grafana-config.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-cloud mr-3"></i>远程日志采集配置
                    </a>
                    <a href="/operation-logs.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-history mr-3"></i>操作日志
                    </a>
                    <a href="/system-config.html" class="block px-4 py-3 rounded-lg bg-blue-800 flex items-center">
                        <i class="fa fa-cog mr-3"></i>推送配置
                    </a>
                </div>
            </nav>
        </div>

        <div class="ml-64 p-8 flex-1">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-800">推送配置</h2>
                <p class="text-gray-500 mt-1">管理全局 Webhook 和免打扰时间</p>
            </div>

            <div id="resultMsg" class="hidden mb-4 p-4 rounded-lg"></div>

            <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="space-y-6">
                    <h3 class="text-lg font-semibold text-gray-800 border-b pb-2">Webhook 配置</h3>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">SQL 预警 Webhook</label>
                        <input type="text" id="config_wechat_webhook" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="企业微信机器人 Webhook URL">
                        <p class="text-xs text-gray-400 mt-1">数据源未配置 webhook 时使用的默认地址</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">日志预警 Webhook</label>
                        <input type="text" id="config_log_wechat_webhook" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="企业微信机器人 Webhook URL">
                        <p class="text-xs text-gray-400 mt-1">规则和数据源均未配置 webhook 时使用的默认地址</p>
                    </div>

                    <h3 class="text-lg font-semibold text-gray-800 border-b pb-2 pt-4">免打扰时段</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">开始小时</label>
                            <select id="config_quiet_start" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                ${Array.from({length: 24}, (_, i) => `<option value="${i}">${String(i).padStart(2,'0')}:00</option>`).join('')}
                            </select>
                            <p class="text-xs text-gray-400 mt-1">此时间后产生的消息延迟到次日推送</p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">结束小时</label>
                            <select id="config_quiet_end" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                ${Array.from({length: 24}, (_, i) => `<option value="${i}">${String(i).padStart(2,'0')}:00</option>`).join('')}
                            </select>
                            <p class="text-xs text-gray-400 mt-1">此时间后恢复实时推送</p>
                        </div>
                    </div>

                    <div class="pt-4">
                        <button onclick="saveConfig()" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center">
                            <i class="fa fa-save mr-2"></i>保存配置
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadConfig() {
            try {
                const response = await fetch('/api/system/config');
                const config = await response.json();
                for (const [key, value] of Object.entries(config)) {
                    const el = document.getElementById('config_' + key);
                    if (el) el.value = value;
                }
            } catch (error) {
                console.error('加载配置失败:', error);
            }
        }

        async function saveConfig() {
            const config = {
                wechat_webhook: document.getElementById('config_wechat_webhook').value,
                log_wechat_webhook: document.getElementById('config_log_wechat_webhook').value,
                quiet_start: document.getElementById('config_quiet_start').value,
                quiet_end: document.getElementById('config_quiet_end').value
            };
            try {
                const response = await fetch('/api/system/config', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                const result = await response.json();
                showResult(result.success, result.message);
            } catch (error) {
                showResult(false, '保存失败: ' + error.message);
            }
        }

        function showResult(success, message) {
            const div = document.getElementById('resultMsg');
            div.className = 'mb-4 p-4 rounded-lg ' + (success ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800');
            div.innerHTML = success
                ? '<i class="fa fa-check-circle mr-2"></i>' + message
                : '<i class="fa fa-times-circle mr-2"></i>' + message;
            div.classList.remove('hidden');
            setTimeout(() => div.classList.add('hidden'), 5000);
        }

        loadConfig();
    </script>
</body>
</html>

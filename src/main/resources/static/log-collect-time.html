<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志采集时间配置 - 监控系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh.js"></script>
</head>
<body class="bg-gray-100">
    <div class="flex">
        <div class="w-64 bg-blue-900 text-white fixed left-0 top-0 min-h-screen">
            <div class="p-6 border-b border-blue-700">
                <h1 class="text-xl font-bold flex items-center">
                    <i class="fa fa-monitor mr-2"></i>监控系统
                </h1>
            </div>
            <nav class="p-4">
                <div class="space-y-2">
                    <a href="/" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-home mr-3"></i>首页统计
                    </a>
                    <a href="/push-records.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-bell mr-3"></i>推送记录
                    </a>
                    <a href="/sql-rules.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-list-alt mr-3"></i>SQL规则管理
                    </a>
                    <a href="/sql-upload.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-folder-open mr-3"></i>SQL文件维护
                    </a>
                    <a href="/sql-config.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-database mr-3"></i>SQL数据源配置
                    </a>
                    <a href="/grafana-config.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-cloud mr-3"></i>远程日志采集配置
                    </a>
                    <a href="/log-collect-time.html" class="block px-4 py-3 rounded-lg bg-blue-800 flex items-center">
                        <i class="fa fa-clock-o mr-3"></i>采集时间配置
                    </a>
                    <a href="/operation-logs.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-history mr-3"></i>操作日志
                    </a>
                    <a href="/system-config.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-cog mr-3"></i>推送配置
                    </a>
                </div>
            </nav>
        </div>

        <div class="ml-64 p-8 flex-1">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-800">日志采集时间配置</h2>
                <p class="text-gray-500 mt-1">管理每条规则的日志采集起始时间，修改后实时生效</p>
            </div>

            <div id="resultMsg" class="hidden mb-4 p-4 rounded-lg"></div>

            <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">环境</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">规则</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">当前采集起始时间</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="timesBody">
                            <tr>
                                <td colspan="4" class="px-6 py-12 text-center text-gray-500">
                                    <i class="fa fa-spinner fa-spin mr-2"></i>加载中...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full mx-4">
            <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800">修改采集起始时间</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">环境</label>
                    <p id="editEnv" class="text-sm text-gray-900 font-medium"></p>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">规则</label>
                    <p id="editRule" class="text-sm text-gray-900 font-medium"></p>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">采集起始时间 *</label>
                    <input type="text" id="editLastTime" readonly class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 cursor-pointer bg-white">
                    <p class="text-xs text-gray-400 mt-1">设置后程序将从该时间开始重新采集日志</p>
                </div>
                <input type="hidden" id="editId">
            </div>
            <div class="p-6 border-t border-gray-200 flex justify-end space-x-4">
                <button onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">取消</button>
                <button onclick="saveTime()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
            </div>
        </div>
    </div>

    <script>
        let fp = null;

        async function loadTimes() {
            try {
                const response = await fetch('/api/log-collect/times');
                const data = await response.json();
                const tbody = document.getElementById('timesBody');
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-12 text-center text-gray-500">暂无数据</td></tr>';
                    return;
                }
                tbody.innerHTML = data.map(item => {
                    const lastTime = item.lastTime ? formatTime(item.lastTime) : '-';
                    return `
                        <tr class="border-b border-gray-100 hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="text-sm font-medium text-gray-900">${escapeHtml(item.environmentName || '-')}</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="text-sm text-gray-600">${escapeHtml(item.ruleName || '-')}</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="text-sm font-mono text-gray-700">${lastTime}</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <button onclick="editTime(${item.id})" class="text-blue-600 hover:text-blue-800 text-sm">
                                    <i class="fa fa-edit mr-1"></i>修改
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('加载采集时间数据失败:', error);
                document.getElementById('timesBody').innerHTML = '<tr><td colspan="4" class="px-6 py-12 text-center text-gray-500">加载失败</td></tr>';
            }
        }

        function editTime(id) {
            fetch('/api/log-collect/times').then(r => r.json()).then(data => {
                const item = data.find(d => d.id === id);
                if (!item) { alert('获取信息失败'); return; }
                document.getElementById('editId').value = item.id;
                document.getElementById('editEnv').textContent = item.environmentName || '-';
                document.getElementById('editRule').textContent = item.ruleName || '-';
                const initVal = item.lastTime ? formatTime(item.lastTime) : '';
                document.getElementById('editLastTime').value = initVal;
                document.getElementById('editModal').classList.remove('hidden');
                if (fp) fp.destroy();
                fp = flatpickr("#editLastTime", {
                    enableTime: true,
                    enableSeconds: true,
                    time_24hr: true,
                    locale: "zh",
                    dateFormat: "Y-m-d H:i:ss",
                    defaultDate: initVal || new Date(),
                    minuteIncrement: 1
                });
            }).catch(e => { alert('获取信息失败: ' + e.message); });
        }

        async function saveTime() {
            const id = document.getElementById('editId').value;
            const lastTime = document.getElementById('editLastTime').value;
            if (!lastTime) { alert('请选择时间'); return; }
            try {
                const response = await fetch('/api/log-collect/times/' + id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lastTime: lastTime })
                });
                const result = await response.json();
                if (result.success) {
                    showResult(true, '保存成功，采集程序已按新时间生效');
                    closeModal();
                    loadTimes();
                } else {
                    showResult(false, result.message);
                }
            } catch (e) {
                showResult(false, '保存失败: ' + e.message);
            }
        }

        function closeModal() {
            document.getElementById('editModal').classList.add('hidden');
            if (fp) { fp.destroy(); fp = null; }
        }

        function showResult(success, message) {
            const div = document.getElementById('resultMsg');
            div.className = 'mb-4 p-4 rounded-lg ' + (success ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800');
            div.innerHTML = success
                ? '<i class="fa fa-check-circle mr-2"></i>' + message
                : '<i class="fa fa-times-circle mr-2"></i>' + message;
            div.classList.remove('hidden');
            setTimeout(() => div.classList.add('hidden'), 5000);
        }

        function formatTime(timeStr) {
            if (!timeStr) return '-';
            const d = new Date(timeStr);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const h = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            const s = String(d.getSeconds()).padStart(2, '0');
            return y + '-' + m + '-' + day + ' ' + h + ':' + min + ':' + s;
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        loadTimes();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作记录 - 监控系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.0/dist/tailwind.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .nav-item:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }
        .status-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <div class="w-64 bg-blue-900 text-white fixed left-0 top-0 h-full">
            <div class="p-6 border-b border-blue-700">
                <h1 class="text-xl font-bold flex items-center">
                    <i class="fa fa-monitor mr-2"></i>监控系统
                </h1>
            </div>
            <nav class="p-4 space-y-2">
                <a href="/index.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                    <i class="fa fa-home mr-3"></i>首页
                </a>
                <a href="/push-records.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                    <i class="fa fa-history mr-3"></i>推送记录
                </a>
                <a href="/sql-rules.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                    <i class="fa fa-list-alt mr-3"></i>SQL规则管理
                </a>
                <a href="/sql-upload.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                    <i class="fa fa-folder-open mr-3"></i>SQL文件维护
                </a>
                <a href="/operation-logs.html" class="block px-4 py-3 rounded-lg bg-blue-800 flex items-center">
                    <i class="fa fa-file-text mr-3"></i>操作记录
                </a>
                <a href="/sql-data-sources.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                    <i class="fa fa-database mr-3"></i>SQL数据源维护
                </a>
                <a href="/remote-log-sources.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                    <i class="fa fa-cloud mr-3"></i>日志采集源维护
                </a>
            </nav>
        </div>

        <div class="ml-64 p-8 flex-1">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-800">操作记录</h2>
                <p class="text-gray-500 mt-1">系统操作审计记录，包含访问记录和数据变更记录</p>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center space-x-4">
                        <select id="moduleFilter" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" onchange="loadLogs()">
                            <option value="">全部模块</option>
                            <option value="页面访问">页面访问</option>
                            <option value="SQL规则">SQL规则</option>
                            <option value="SQL文件">SQL文件</option>
                            <option value="SQL数据源">SQL数据源</option>
                            <option value="远程日志采集源">远程日志采集源</option>
                        </select>
                        <select id="typeFilter" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" onchange="loadLogs()">
                            <option value="">全部操作类型</option>
                            <option value="访问">访问</option>
                            <option value="新增">新增</option>
                            <option value="编辑">编辑</option>
                            <option value="删除">删除</option>
                        </select>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">时间</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作类型</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">模块</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">内容</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">环境</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">IP地址</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">浏览器</th>
                            </tr>
                        </thead>
                        <tbody id="logsBody">
                            <tr>
                                <td colspan="7" class="px-6 py-12 text-center text-gray-500">
                                    <i class="fa fa-spinner fa-spin mr-2"></i>加载中...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="flex items-center justify-between mt-4">
                    <span class="text-sm text-gray-500">显示第 <span id="currentPage">1</span> 页，共 <span id="totalPages">1</span> 页</span>
                    <div class="flex items-center space-x-2">
                        <button onclick="prevPage()" class="px-3 py-1 text-sm border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" id="prevBtn">上一页</button>
                        <button onclick="nextPage()" class="px-3 py-1 text-sm border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" id="nextBtn">下一页</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;

        async function loadLogs() {
            try {
                const module = document.getElementById('moduleFilter').value;
                const type = document.getElementById('typeFilter').value;
                
                let url = `/api/operation-logs?page=${currentPage}&size=20`;
                if (module) url += `&operationModule=${encodeURIComponent(module)}`;
                if (type) url += `&operationType=${encodeURIComponent(type)}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                const tbody = document.getElementById('logsBody');
                if (!data.records || data.records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-12 text-center text-gray-500">暂无记录</td></tr>';
                    return;
                }
                
                totalPages = data.pages;
                document.getElementById('currentPage').textContent = currentPage;
                document.getElementById('totalPages').textContent = totalPages;
                document.getElementById('prevBtn').disabled = currentPage === 1;
                document.getElementById('nextBtn').disabled = currentPage >= totalPages;
                
                tbody.innerHTML = data.records.map(log => {
                    const typeClass = getTypeClass(log.operationType);
                    return `
                        <tr class="border-b border-gray-100 hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formatTime(log.createTime)}</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="status-badge ${typeClass}">${log.operationType}</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${log.operationModule}</td>
                            <td class="px-6 py-4 text-sm text-gray-600 max-w-xs truncate" title="${log.operationContent}">${log.operationContent}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${log.environmentName || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${log.ipAddress || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${log.browserInfo || '-'}</td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('获取操作记录失败:', error);
                document.getElementById('logsBody').innerHTML = '<tr><td colspan="7" class="px-6 py-12 text-center text-gray-500">加载失败</td></tr>';
            }
        }

        function getTypeClass(type) {
            switch(type) {
                case '访问': return 'bg-blue-100 text-blue-800';
                case '新增': return 'bg-green-100 text-green-800';
                case '编辑': return 'bg-yellow-100 text-yellow-800';
                case '删除': return 'bg-red-100 text-red-800';
                default: return 'bg-gray-100 text-gray-800';
            }
        }

        function formatTime(timeStr) {
            if (!timeStr) return '-';
            const date = new Date(timeStr);
            return date.toLocaleString('zh-CN', {
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                loadLogs();
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                loadLogs();
            }
        }

        loadLogs();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作日志 - 监控系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh.js"></script>
</head>
<body class="bg-gray-100">
    <div class="flex">
        <div class="w-64 bg-blue-900 text-white fixed left-0 top-0 min-h-screen">
            <div class="p-6 border-b border-blue-700">
                <h1 class="text-xl font-bold flex items-center">
                    <i class="fa fa-monitor mr-2"></i>监控系统
                </h1>
            </div>
            <nav class="p-4">
                <div class="space-y-2">
                    <a href="/" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-home mr-3"></i>首页统计
                    </a>
                    <a href="/push-records.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-bell mr-3"></i>推送记录
                    </a>
                    <a href="/sql-rules.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-list-alt mr-3"></i>SQL规则管理
                    </a>
                    <a href="/sql-upload.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-folder-open mr-3"></i>SQL文件维护
                    </a>
                    <a href="/sql-config.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-database mr-3"></i>SQL数据源配置
                    </a>
                    <a href="/grafana-config.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-cloud mr-3"></i>远程日志采集配置
                    </a>
                    <a href="/operation-logs.html" class="block px-4 py-3 rounded-lg bg-blue-800 flex items-center">
                        <i class="fa fa-history mr-3"></i>操作日志
                    </a>
                </div>
            </nav>
        </div>

        <div class="ml-64 p-8 flex-1">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-800">操作日志</h2>
                <p class="text-gray-500 mt-1">查看系统操作历史记录</p>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <select id="filterOperationType" onchange="loadLogs(1)" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                <option value="">全部类型</option>
                                <option value="VISIT">访问</option>
                                <option value="CREATE">创建</option>
                                <option value="EDIT">编辑</option>
                                <option value="DELETE">删除</option>
                            </select>
                        </div>
                        <div class="relative">
                            <select id="filterModule" onchange="loadLogs(1)" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                <option value="">全部模块</option>
                            </select>
                        </div>
                        <div class="flex items-center space-x-2">
                            <div class="relative">
                                <input type="text" id="dateRangePicker" placeholder="选择日期范围" readonly class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 w-64 cursor-pointer bg-white text-sm">
                            </div>
                            <div class="relative">
                                <select id="filterDatePreset" onchange="onDatePresetChange()" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                                    <option value="">快捷选择</option>
                                    <option value="today">今天</option>
                                    <option value="yesterday">昨天</option>
                                    <option value="last7">近7天</option>
                                    <option value="last30">近30天</option>
                                    <option value="thisMonth">本月</option>
                                    <option value="lastMonth">上月</option>
                                </select>
                            </div>
                            <button onclick="resetFilters()" class="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 flex items-center">
                                <i class="fa fa-refresh mr-2"></i>重置
                            </button>
                        </div>
                    </div>
                </div>
                    <table class="w-full">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">IP地址</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作类型</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">模块</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">详情</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作时间</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="logsBody">
                            <tr>
                                <td colspan="7" class="px-6 py-12 text-center text-gray-500">
                                    <i class="fa fa-spinner fa-spin mr-2"></i>加载中...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="flex items-center justify-between mt-6">
                    <div class="text-sm text-gray-500">
                        共 <span id="totalRecords">0</span> 条记录
                    </div>
                    <div class="flex items-center space-x-2">
                        <button id="prevPage" onclick="changePage(currentPage - 1)" disabled class="px-3 py-1 bg-gray-100 text-gray-600 rounded disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fa fa-chevron-left"></i>
                        </button>
                        <span id="pageInfo" class="text-sm text-gray-600">第 1 页</span>
                        <button id="nextPage" onclick="changePage(currentPage + 1)" class="px-3 py-1 bg-gray-100 text-gray-600 rounded hover:bg-gray-200">
                            <i class="fa fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full mx-4 max-h-[80vh] overflow-hidden">
            <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800">操作详情</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto max-h-[60vh]">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ID</label>
                        <span id="detailId" class="text-sm text-gray-600"></span>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">IP地址</label>
                        <span id="detailIp" class="text-sm text-gray-600"></span>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">User Agent</label>
                        <span id="detailUserAgent" class="text-sm text-gray-600 break-all"></span>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">操作类型</label>
                        <span id="detailOperationType" class="px-2 py-1 bg-blue-100 text-blue-800 rounded text-sm"></span>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">模块</label>
                        <span id="detailModule" class="text-sm text-gray-600"></span>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">目标ID</label>
                        <span id="detailTargetId" class="text-sm text-gray-600"></span>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">详情</label>
                        <pre id="detailDetail" class="bg-gray-50 p-4 rounded-lg text-sm text-gray-700 whitespace-pre-wrap break-words"></pre>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">操作时间</label>
                        <span id="detailCreateTime" class="text-sm text-gray-600"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let dateRangePicker;

        async function loadModules() {
            try {
                const response = await fetch('/api/logs/modules');
                const modules = await response.json();
                const select = document.getElementById('filterModule');
                modules.forEach(module => {
                    const option = document.createElement('option');
                    option.value = module;
                    option.textContent = module;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('加载模块列表失败:', error);
            }
        }

        function getFilterParams() {
            const operationType = document.getElementById('filterOperationType').value;
            const module = document.getElementById('filterModule').value;
            const dates = dateRangePicker ? dateRangePicker.selectedDates : [];
            let startDate = '', endDate = '';
            if (dates.length === 2) {
                startDate = flatpickr.formatDate(dates[0], 'Y-m-d');
                endDate = flatpickr.formatDate(dates[1], 'Y-m-d');
            }

            const params = new URLSearchParams();
            if (operationType) params.append('operationType', operationType);
            if (module) params.append('module', module);
            if (startDate) params.append('startDate', startDate);
            if (endDate) params.append('endDate', endDate);

            return params.toString();
        }

        function onDatePresetChange() {
            const preset = document.getElementById('filterDatePreset').value;
            if (!preset) return;
            const today = new Date();
            let startDate, endDate = new Date(today);

            switch (preset) {
                case 'today':
                    startDate = new Date(today);
                    break;
                case 'yesterday':
                    startDate = new Date(today);
                    startDate.setDate(startDate.getDate() - 1);
                    endDate = new Date(startDate);
                    break;
                case 'last7':
                    startDate = new Date(today);
                    startDate.setDate(startDate.getDate() - 6);
                    break;
                case 'last30':
                    startDate = new Date(today);
                    startDate.setDate(startDate.getDate() - 29);
                    break;
                case 'thisMonth':
                    startDate = new Date(today.getFullYear(), today.getMonth(), 1);
                    break;
                case 'lastMonth':
                    startDate = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                    endDate = new Date(today.getFullYear(), today.getMonth(), 0);
                    break;
            }

            dateRangePicker.setDate([startDate, endDate]);
            loadLogs(1);
        }

        async function loadLogs(page = 1) {
            try {
                currentPage = page;
                const filterParams = getFilterParams();
                const response = await fetch(`/api/logs?page=${page}&size=20&${filterParams}`);
                const data = await response.json();

                const tbody = document.getElementById('logsBody');
                if (!data.records || data.records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-12 text-center text-gray-500">暂无数据</td></tr>';
                    document.getElementById('totalRecords').textContent = '0';
                    document.getElementById('pageInfo').textContent = '第 1 页';
                    document.getElementById('prevPage').disabled = true;
                    document.getElementById('nextPage').disabled = true;
                    totalPages = 1;
                    return;
                }

                totalPages = data.pages || 1;

                tbody.innerHTML = data.records.map(log => {
                    const detail = log.detail?.length > 50 ? log.detail.substring(0, 50) + '...' : log.detail;
                    const operationTypeText = getOperationTypeText(log.operationType);
                    const operationTypeClass = getOperationTypeClass(log.operationType);

                    return `
                        <tr class="border-b border-gray-100 hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${log.id}</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 py-0.5 text-xs font-medium rounded-full bg-blue-100 text-blue-800">${log.ip || '-'}</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 py-0.5 text-xs font-medium rounded-full ${operationTypeClass}">${operationTypeText}</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-2 py-0.5 text-xs font-medium rounded-full bg-green-100 text-green-800">${log.module || '-'}</span>
                            </td>
                            <td class="px-6 py-4">
                                <p class="text-sm text-gray-700 max-w-xs truncate">${detail || '无内容'}</p>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formatTime(log.createTime)}</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <button onclick="showDetail(${JSON.stringify(log).replace(/"/g, '&quot;')})" class="text-blue-600 hover:text-blue-800 text-sm">
                                    <i class="fa fa-eye mr-1"></i>查看详情
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');

                document.getElementById('totalRecords').textContent = data.total;
                document.getElementById('pageInfo').textContent = `第 ${currentPage} / ${totalPages} 页`;
                document.getElementById('prevPage').disabled = currentPage <= 1;
                document.getElementById('nextPage').disabled = currentPage >= totalPages;
            } catch (error) {
                console.error('获取操作日志失败:', error);
                document.getElementById('logsBody').innerHTML = '<tr><td colspan="7" class="px-6 py-12 text-center text-gray-500">加载失败</td></tr>';
            }
        }

        function getOperationTypeText(type) {
            const typeMap = {
                'VISIT': '访问',
                'CREATE': '创建',
                'EDIT': '编辑',
                'DELETE': '删除'
            };
            return typeMap[type] || type || '-';
        }

        function getOperationTypeClass(type) {
            const classMap = {
                'VISIT': 'bg-blue-100 text-blue-800',
                'CREATE': 'bg-green-100 text-green-800',
                'EDIT': 'bg-yellow-100 text-yellow-800',
                'DELETE': 'bg-red-100 text-red-800'
            };
            return classMap[type] || 'bg-gray-100 text-gray-800';
        }

        function resetFilters() {
            document.getElementById('filterOperationType').value = '';
            document.getElementById('filterModule').value = '';
            document.getElementById('filterDatePreset').value = '';
            dateRangePicker.clear();
            loadLogs(1);
        }

        function changePage(page) {
            if (page < 1 || page > totalPages) return;
            loadLogs(page);
        }

        function showDetail(log) {
            document.getElementById('detailId').textContent = log.id;
            document.getElementById('detailIp').textContent = log.ip || '-';
            document.getElementById('detailUserAgent').textContent = log.userAgent || '-';
            document.getElementById('detailOperationType').textContent = log.operationType || '-';
            document.getElementById('detailModule').textContent = log.module || '-';
            document.getElementById('detailTargetId').textContent = log.targetId || '-';
            document.getElementById('detailDetail').textContent = log.detail || '无内容';
            document.getElementById('detailCreateTime').textContent = formatTime(log.createTime);
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        function formatTime(timeStr) {
            if (!timeStr) return '-';
            const date = new Date(timeStr);
            return date.toLocaleString('zh-CN');
        }

        loadModules();
        dateRangePicker = flatpickr("#dateRangePicker", {
            mode: "range",
            locale: "zh",
            dateFormat: "Y-m-d",
            onChange: function(selectedDates) {
                document.getElementById('filterDatePreset').value = '';
                if (selectedDates.length === 2) {
                    loadLogs(1);
                }
            }
        });
        loadLogs();
    </script>
</body>
</html>

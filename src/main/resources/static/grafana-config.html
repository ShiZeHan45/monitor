<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>远程日志采集配置 - 监控系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="flex">
        <div class="w-64 bg-blue-900 text-white fixed left-0 top-0 min-h-screen">
            <div class="p-6 border-b border-blue-700">
                <h1 class="text-xl font-bold flex items-center">
                    <i class="fa fa-monitor mr-2"></i>监控系统
                </h1>
            </div>
            <nav class="p-4">
                <div class="space-y-2">
                    <a href="/" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-home mr-3"></i>首页统计
                    </a>
                    <a href="/push-records.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-bell mr-3"></i>推送记录
                    </a>
                    <a href="/sql-rules.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-list-alt mr-3"></i>SQL规则管理
                    </a>
                    <a href="/sql-upload.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-folder-open mr-3"></i>SQL文件维护
                    </a>
                    <a href="/grafana-config.html" class="block px-4 py-3 rounded-lg bg-blue-800 flex items-center">
                        <i class="fa fa-cloud mr-3"></i>远程日志采集配置
                    </a>
                </div>
            </nav>
        </div>

        <div class="ml-64 p-8 flex-1">
            <div class="mb-6">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">远程日志采集配置</h2>
                        <p class="text-gray-500 mt-1">配置Grafana数据源和监控规则</p>
                    </div>
                    <button onclick="refreshConfig()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center">
                        <i class="fa fa-refresh mr-2"></i>刷新配置
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                            <i class="fa fa-server mr-2"></i>数据源列表
                        </h3>
                        <button onclick="showAddDataSourceModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm flex items-center">
                            <i class="fa fa-plus mr-1"></i>新增数据源
                        </button>
                    </div>
                    <div class="space-y-3" id="dataSourceList">
                        <div class="flex items-center justify-center text-gray-500 py-8">
                            <i class="fa fa-spinner fa-spin mr-2"></i>加载中...
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                            <i class="fa fa-list-alt mr-2"></i>监控规则
                        </h3>
                        <button onclick="showAddRuleModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm flex items-center" id="addRuleBtn" disabled>
                            <i class="fa fa-plus mr-1"></i>新增规则
                        </button>
                    </div>
                    <div class="space-y-3" id="ruleList">
                        <div class="flex items-center justify-center text-gray-500 py-8">
                            <i class="fa fa-info-circle mr-2"></i>请先选择数据源
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="dataSourceModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-hidden">
            <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800" id="dataSourceModalTitle">新增数据源</h3>
                <button onclick="closeDataSourceModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto max-h-[70vh]">
                <form id="dataSourceForm">
                    <input type="hidden" id="dsId">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">环境名称 *</label>
                            <input type="text" id="dsEnvironmentName" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Grafana URL *</label>
                            <input type="text" id="dsUrl" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">数据源ID *</label>
                            <input type="text" id="dsDatasourceId" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">用户名 *</label>
                            <input type="text" id="dsUsername" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">密码 *</label>
                            <input type="password" id="dsPassword" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">推送Webhook</label>
                            <input type="text" id="dsWebhook" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">开始时间 (HH:mm)</label>
                            <input type="text" id="dsStartTime" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="08:00">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">结束时间 (HH:mm)</label>
                            <input type="text" id="dsEndTime" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="20:00">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">星期 (逗号分隔)</label>
                            <input type="text" id="dsWeek" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="1,2,3,4,5,6,7">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">是否启用</label>
                            <select id="dsEnabled" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                <option value="1">启用</option>
                                <option value="0">禁用</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="p-6 border-t border-gray-200 flex justify-end space-x-4">
                <button onclick="closeDataSourceModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                    取消
                </button>
                <button onclick="saveDataSource()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    保存
                </button>
            </div>
        </div>
    </div>

    <div id="ruleModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-hidden">
            <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800" id="ruleModalTitle">新增监控规则</h3>
                <button onclick="closeRuleModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto max-h-[70vh]">
                <form id="ruleForm">
                    <input type="hidden" id="ruleId">
                    <input type="hidden" id="ruleDataSourceId">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">规则名称 *</label>
                            <input type="text" id="ruleName" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">上下文行数</label>
                            <input type="number" id="ruleContextLines" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" value="5" min="1" max="20">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">查询表达式 *</label>
                            <textarea id="ruleQueryExpr" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" rows="3" required></textarea>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">关键词 (每行一个)</label>
                            <textarea id="ruleKeywords" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" rows="3" placeholder="error&#10;Exception&#10;fail"></textarea>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">排除关键词 (每行一个)</label>
                            <textarea id="ruleExclusionKeywords" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" rows="3" placeholder="DEBUG&#10;INFO"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">推送Webhook (留空使用数据源默认)</label>
                            <input type="text" id="ruleWebhook" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">是否启用</label>
                            <select id="ruleEnabled" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                <option value="1">启用</option>
                                <option value="0">禁用</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="p-6 border-t border-gray-200 flex justify-end space-x-4">
                <button onclick="closeRuleModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                    取消
                </button>
                <button onclick="saveRule()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    保存
                </button>
            </div>
        </div>
    </div>

    <script>
        let selectedDataSource = null;

        async function loadDataSources() {
            try {
                const response = await fetch('/api/grafana/datasources');
                const dataSources = await response.json();
                const container = document.getElementById('dataSourceList');
                
                if (!dataSources || dataSources.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-500 py-8">暂无数据源</div>';
                    return;
                }
                
                container.innerHTML = dataSources.map(ds => `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg cursor-pointer hover:bg-blue-50 transition-colors ${selectedDataSource?.id === ds.id ? 'ring-2 ring-blue-500' : ''}" onclick="selectDataSource(${JSON.stringify(ds).replace(/"/g, '&quot;')})">
                        <div class="flex items-center">
                            <i class="fa fa-server text-blue-500 mr-3"></i>
                            <div>
                                <div class="text-sm font-medium text-gray-800">${ds.environmentName}</div>
                                <div class="text-xs text-gray-500">${ds.url}</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="px-2 py-0.5 text-xs rounded-full ${ds.enabled === 1 ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">${ds.enabled === 1 ? '启用' : '禁用'}</span>
                            <button onclick="editDataSource(${JSON.stringify(ds).replace(/"/g, '&quot;')}); event.stopPropagation()" class="text-blue-500 hover:text-blue-700" title="编辑">
                                <i class="fa fa-pencil"></i>
                            </button>
                            <button onclick="deleteDataSource(${ds.id}); event.stopPropagation()" class="text-red-500 hover:text-red-700" title="删除">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('获取数据源列表失败:', error);
                document.getElementById('dataSourceList').innerHTML = '<div class="text-center text-gray-500 py-8">加载失败</div>';
            }
        }

        async function loadRules(dataSourceId) {
            if (!dataSourceId) {
                document.getElementById('ruleList').innerHTML = '<div class="text-center text-gray-500 py-8">请先选择数据源</div>';
                document.getElementById('addRuleBtn').disabled = true;
                return;
            }
            
            try {
                const response = await fetch(`/api/grafana/datasources/${dataSourceId}/rules`);
                const rules = await response.json();
                const container = document.getElementById('ruleList');
                
                if (!rules || rules.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-500 py-8">该数据源暂无监控规则</div>';
                    document.getElementById('addRuleBtn').disabled = false;
                    return;
                }
                
                container.innerHTML = rules.map(rule => `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <div class="flex items-center">
                            <i class="fa fa-filter text-green-500 mr-3"></i>
                            <div>
                                <div class="text-sm font-medium text-gray-800">${rule.name}</div>
                                <div class="text-xs text-gray-500 truncate max-w-xs">${rule.queryExpr}</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="px-2 py-0.5 text-xs rounded-full ${rule.enabled === 1 ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}">${rule.enabled === 1 ? '启用' : '禁用'}</span>
                            <button onclick="editRule(${JSON.stringify(rule).replace(/"/g, '&quot;')})" class="text-blue-500 hover:text-blue-700" title="编辑">
                                <i class="fa fa-pencil"></i>
                            </button>
                            <button onclick="deleteRule(${rule.id})" class="text-red-500 hover:text-red-700" title="删除">
                                <i class="fa fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
                document.getElementById('addRuleBtn').disabled = false;
            } catch (error) {
                console.error('获取规则列表失败:', error);
                document.getElementById('ruleList').innerHTML = '<div class="text-center text-gray-500 py-8">加载失败</div>';
            }
        }

        function selectDataSource(ds) {
            selectedDataSource = ds;
            loadDataSources();
            loadRules(ds.id);
        }

        function showAddDataSourceModal() {
            document.getElementById('dataSourceModalTitle').textContent = '新增数据源';
            document.getElementById('dsId').value = '';
            document.getElementById('dsEnvironmentName').value = '';
            document.getElementById('dsUrl').value = '';
            document.getElementById('dsDatasourceId').value = '';
            document.getElementById('dsUsername').value = '';
            document.getElementById('dsPassword').value = '';
            document.getElementById('dsWebhook').value = '';
            document.getElementById('dsStartTime').value = '';
            document.getElementById('dsEndTime').value = '';
            document.getElementById('dsWeek').value = '1,2,3,4,5,6,7';
            document.getElementById('dsEnabled').value = '1';
            document.getElementById('dataSourceModal').classList.remove('hidden');
        }

        function editDataSource(ds) {
            document.getElementById('dataSourceModalTitle').textContent = '编辑数据源';
            document.getElementById('dsId').value = ds.id;
            document.getElementById('dsEnvironmentName').value = ds.environmentName;
            document.getElementById('dsUrl').value = ds.url;
            document.getElementById('dsDatasourceId').value = ds.datasourceId;
            document.getElementById('dsUsername').value = ds.username;
            document.getElementById('dsPassword').value = ds.password;
            document.getElementById('dsWebhook').value = ds.webhook || '';
            document.getElementById('dsStartTime').value = ds.startTime || '';
            document.getElementById('dsEndTime').value = ds.endTime || '';
            document.getElementById('dsWeek').value = ds.week ? JSON.parse(ds.week).join(',') : '1,2,3,4,5,6,7';
            document.getElementById('dsEnabled').value = ds.enabled;
            document.getElementById('dataSourceModal').classList.remove('hidden');
        }

        function closeDataSourceModal() {
            document.getElementById('dataSourceModal').classList.add('hidden');
        }

        async function saveDataSource() {
            const id = document.getElementById('dsId').value;
            const weekValue = document.getElementById('dsWeek').value;
            const weekArray = weekValue ? weekValue.split(',').map(w => parseInt(w.trim())).filter(w => !isNaN(w)) : [1,2,3,4,5,6,7];
            
            const data = {
                id: id ? parseInt(id) : null,
                environmentName: document.getElementById('dsEnvironmentName').value,
                url: document.getElementById('dsUrl').value,
                datasourceId: document.getElementById('dsDatasourceId').value,
                username: document.getElementById('dsUsername').value,
                password: document.getElementById('dsPassword').value,
                webhook: document.getElementById('dsWebhook').value,
                startTime: document.getElementById('dsStartTime').value,
                endTime: document.getElementById('dsEndTime').value,
                week: JSON.stringify(weekArray),
                enabled: parseInt(document.getElementById('dsEnabled').value)
            };

            try {
                const response = await fetch(`/api/grafana/datasources${id ? '/' + id : ''}`, {
                    method: id ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                if (result.success) {
                    alert(result.message);
                    closeDataSourceModal();
                    loadDataSources();
                    if (selectedDataSource && (id ? parseInt(id) === selectedDataSource.id : false)) {
                        loadRules(selectedDataSource.id);
                    }
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('保存失败:', error);
                alert('保存失败');
            }
        }

        async function deleteDataSource(id) {
            if (!confirm('确定要删除该数据源及其所有规则吗？')) return;
            
            try {
                const response = await fetch(`/api/grafana/datasources/${id}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                
                if (result.success) {
                    alert(result.message);
                    if (selectedDataSource && selectedDataSource.id === id) {
                        selectedDataSource = null;
                        loadRules(null);
                    }
                    loadDataSources();
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败');
            }
        }

        function showAddRuleModal() {
            if (!selectedDataSource) {
                alert('请先选择数据源');
                return;
            }
            
            document.getElementById('ruleModalTitle').textContent = '新增监控规则';
            document.getElementById('ruleId').value = '';
            document.getElementById('ruleDataSourceId').value = selectedDataSource.id;
            document.getElementById('ruleName').value = '';
            document.getElementById('ruleQueryExpr').value = '';
            document.getElementById('ruleKeywords').value = '';
            document.getElementById('ruleExclusionKeywords').value = '';
            document.getElementById('ruleContextLines').value = '5';
            document.getElementById('ruleWebhook').value = '';
            document.getElementById('ruleEnabled').value = '1';
            document.getElementById('ruleModal').classList.remove('hidden');
        }

        function editRule(rule) {
            document.getElementById('ruleModalTitle').textContent = '编辑监控规则';
            document.getElementById('ruleId').value = rule.id;
            document.getElementById('ruleDataSourceId').value = rule.dataSourceId;
            document.getElementById('ruleName').value = rule.name;
            document.getElementById('ruleQueryExpr').value = rule.queryExpr;
            document.getElementById('ruleKeywords').value = rule.keywords ? JSON.parse(rule.keywords).join('\n') : '';
            document.getElementById('ruleExclusionKeywords').value = rule.exclusionKeywords ? JSON.parse(rule.exclusionKeywords).join('\n') : '';
            document.getElementById('ruleContextLines').value = rule.contextLines || '5';
            document.getElementById('ruleWebhook').value = rule.webhook || '';
            document.getElementById('ruleEnabled').value = rule.enabled;
            document.getElementById('ruleModal').classList.remove('hidden');
        }

        function closeRuleModal() {
            document.getElementById('ruleModal').classList.add('hidden');
        }

        async function saveRule() {
            const id = document.getElementById('ruleId').value;
            const keywords = document.getElementById('ruleKeywords').value;
            const exclusionKeywords = document.getElementById('ruleExclusionKeywords').value;
            
            const data = {
                id: id ? parseInt(id) : null,
                dataSourceId: parseInt(document.getElementById('ruleDataSourceId').value),
                name: document.getElementById('ruleName').value,
                queryExpr: document.getElementById('ruleQueryExpr').value,
                keywords: JSON.stringify(keywords ? keywords.split('\n').filter(k => k.trim()) : []),
                exclusionKeywords: JSON.stringify(exclusionKeywords ? exclusionKeywords.split('\n').filter(k => k.trim()) : []),
                contextLines: parseInt(document.getElementById('ruleContextLines').value),
                webhook: document.getElementById('ruleWebhook').value,
                enabled: parseInt(document.getElementById('ruleEnabled').value)
            };

            try {
                const response = await fetch(`/api/grafana/rules${id ? '/' + id : ''}`, {
                    method: id ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                if (result.success) {
                    alert(result.message);
                    closeRuleModal();
                    loadRules(selectedDataSource.id);
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('保存失败:', error);
                alert('保存失败');
            }
        }

        async function deleteRule(id) {
            if (!confirm('确定要删除该规则吗？')) return;
            
            try {
                const response = await fetch(`/api/grafana/rules/${id}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                
                if (result.success) {
                    alert(result.message);
                    loadRules(selectedDataSource.id);
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败');
            }
        }

        async function refreshConfig() {
            try {
                const response = await fetch('/api/grafana/refresh', {
                    method: 'POST'
                });
                const result = await response.json();
                
                if (result.success) {
                    alert('配置刷新成功');
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('刷新失败:', error);
                alert('刷新失败');
            }
        }

        loadDataSources();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL文件维护 - 监控系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div class="flex">
        <div class="w-64 bg-blue-900 text-white fixed left-0 top-0 min-h-screen">
            <div class="p-6 border-b border-blue-700">
                <h1 class="text-xl font-bold flex items-center">
                    <i class="fa fa-monitor mr-2"></i>监控系统
                </h1>
            </div>
            <nav class="p-4">
                <div class="space-y-2">
                    <a href="/" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-home mr-3"></i>首页统计
                    </a>
                    <a href="/push-records.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-bell mr-3"></i>推送记录
                    </a>
                    <a href="/sql-rules.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-list-alt mr-3"></i>SQL规则管理
                    </a>
                    <a href="/sql-upload.html" class="block px-4 py-3 rounded-lg bg-blue-800 flex items-center">
                        <i class="fa fa-folder-open mr-3"></i>SQL文件维护
                    </a>
                    <a href="/sql-config.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-database mr-3"></i>SQL数据源配置
                    </a>
                    <a href="/grafana-config.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-cloud mr-3"></i>远程日志采集配置
                    </a>
                    <a href="/operation-logs.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-history mr-3"></i>操作日志
                    </a>
                    <a href="/system-config.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                        <i class="fa fa-cog mr-3"></i>推送配置
                    </a>
                </div>
            </nav>
        </div>

        <div class="ml-64 p-8 flex-1">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-800">SQL文件维护</h2>
                <p class="text-gray-500 mt-1">上传、编辑和管理SQL检测脚本文件</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h3 class="text-lg font-semibold text-gray-800 mb-6 flex items-center">
                        <i class="fa fa-upload mr-2"></i>上传SQL文件
                    </h3>
                    
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-500 transition-colors cursor-pointer" id="dropZone">
                        <i class="fa fa-file-text-o text-5xl text-gray-400 mb-4"></i>
                        <p class="text-gray-600 mb-2">点击或拖拽SQL文件到此处上传</p>
                        <p class="text-sm text-gray-400">支持 .sql 文件格式</p>
                        <input type="file" id="fileInput" accept=".sql" class="hidden">
                    </div>

                    <div id="uploadProgress" class="mt-4 hidden">
                        <div class="flex items-center justify-between mb-2">
                            <span id="uploadFileName" class="text-sm text-gray-600"></span>
                            <span id="uploadPercent" class="text-sm text-gray-600">0%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all"></div>
                        </div>
                    </div>

                    <div id="uploadResult" class="mt-4 p-3 rounded-lg hidden">
                        <p class="text-sm flex items-center" id="resultText"></p>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-lg font-semibold text-gray-800 flex items-center">
                            <i class="fa fa-folder-open mr-2"></i>已上传文件列表
                        </h3>
                        <span id="fileCount" class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm font-medium"></span>
                    </div>
                    
                    <div class="space-y-3" id="fileList">
                        <div class="flex items-center justify-center text-gray-500 py-8">
                            <i class="fa fa-spinner fa-spin mr-2"></i>加载中...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-3xl w-full mx-4 max-h-[80vh] overflow-hidden">
            <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800" id="editModalTitle">编辑SQL文件</h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto max-h-[60vh]">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">文件名</label>
                    <span id="editFilename" class="px-3 py-2 bg-gray-100 rounded-lg text-sm text-gray-700"></span>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">文件内容</label>
                    <textarea id="editContent" class="w-full h-64 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-mono text-sm resize-none"></textarea>
                </div>
            </div>
            <div class="p-6 border-t border-gray-200 flex items-center justify-between">
                <button onclick="runDebugFromEdit()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center">
                    <i class="fa fa-play mr-2"></i>运行调试
                </button>
                <div class="flex space-x-4">
                    <button onclick="closeEditModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                        取消
                    </button>
                    <button onclick="saveFileContent()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="debugModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-5xl w-full mx-4 max-h-[90vh] overflow-hidden">
            <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800">SQL调试运行</h3>
                <button onclick="closeDebugModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto max-h-[80vh]">
                <input type="hidden" id="debugFileName" value="">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">SQL文件</label>
                    <div id="debugFileDisplay" class="px-4 py-2 bg-gray-100 rounded-lg text-sm text-gray-600">手动输入SQL</div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">选择数据源</label>
                    <select id="debugDataSource" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">请选择数据源</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">SQL语句</label>
                    <textarea id="debugSql" class="w-full h-40 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-mono text-sm resize-none" placeholder="输入SQL语句..."></textarea>
                </div>
                <div class="flex justify-end mb-4">
                    <button onclick="executeDebug()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center">
                        <i class="fa fa-play mr-2"></i>执行查询
                    </button>
                </div>
                <div id="debugResult" class="hidden">
                    <div id="debugMessage" class="mb-4 p-3 rounded-lg text-sm"></div>
                    <div id="debugTableContainer" class="overflow-x-auto">
                        <table id="debugTable" class="w-full border-collapse">
                            <thead id="debugTableHead"></thead>
                            <tbody id="debugTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadFiles() {
            try {
                const response = await fetch('/api/sql-files');
                const files = await response.json();
                
                const container = document.getElementById('fileList');
                const countElement = document.getElementById('fileCount');
                
                if (!files || files.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-500 py-8">暂无SQL文件</div>';
                    countElement.textContent = '共 0 个文件';
                    return;
                }
                
                countElement.textContent = `共 ${files.length} 个文件`;
                
                container.innerHTML = files.map(file => {
                    return `
                        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                            <div class="flex items-center">
                                <i class="fa fa-file-code-o text-blue-500 mr-3"></i>
                                <span class="text-sm text-gray-700">${file}</span>
                            </div>
                            <div class="flex items-center space-x-3">
                                <button onclick="debugFile('${file}')" class="text-green-500 hover:text-green-700" title="运行调试">
                                    <i class="fa fa-play"></i>
                                </button>
                                <button onclick="editFile('${file}')" class="text-blue-500 hover:text-blue-700" title="编辑文件">
                                    <i class="fa fa-pencil"></i>
                                </button>
                                <button onclick="deleteFile('${file}')" class="text-red-500 hover:text-red-700" title="删除文件">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('获取文件列表失败:', error);
                document.getElementById('fileList').innerHTML = '<div class="text-center text-gray-500 py-8">加载失败</div>';
                document.getElementById('fileCount').textContent = '';
            }
        }

        async function loadDataSources() {
            try {
                const response = await fetch('/api/datasources');
                const dataSources = await response.json();
                const select = document.getElementById('debugDataSource');
                select.innerHTML = '<option value="">请选择数据源</option>';
                dataSources.forEach(ds => {
                    const option = document.createElement('option');
                    option.value = ds;
                    option.textContent = ds;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('获取数据源列表失败:', error);
            }
        }

        async function debugFile(filename) {
            await loadDataSources();
            try {
                const response = await fetch(`/api/sql-files/${filename}/content`);
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('debugSql').value = result.content;
                    document.getElementById('debugDataSource').value = '';
                    document.getElementById('debugFileName').value = filename;
                    document.getElementById('debugFileDisplay').textContent = filename;
                    document.getElementById('debugResult').classList.add('hidden');
                    document.getElementById('debugModal').classList.remove('hidden');
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('读取文件失败:', error);
                alert('读取文件失败');
            }
        }

        async function executeDebug() {
            const environment = document.getElementById('debugDataSource').value;
            const sql = document.getElementById('debugSql').value;
            const filename = document.getElementById('debugFileName').value;
            
            if (!environment) {
                alert('请选择数据源');
                return;
            }
            
            if (!sql.trim()) {
                alert('请输入SQL语句');
                return;
            }

            const debugResult = document.getElementById('debugResult');
            const debugMessage = document.getElementById('debugMessage');
            const debugTableContainer = document.getElementById('debugTableContainer');
            const debugTableHead = document.getElementById('debugTableHead');
            const debugTableBody = document.getElementById('debugTableBody');

            debugResult.classList.remove('hidden');
            debugMessage.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>执行中...';
            debugMessage.className = 'mb-4 p-3 rounded-lg text-sm bg-blue-50 text-blue-700';
            debugTableContainer.classList.add('hidden');

            try {
                const response = await fetch('/api/sql-debug/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ environment: environment, sql: sql, filename: filename })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    debugMessage.innerHTML = `<i class="fa fa-check-circle mr-2"></i>${result.message}`;
                    debugMessage.className = 'mb-4 p-3 rounded-lg text-sm bg-green-50 text-green-700';
                    
                    debugTableContainer.classList.remove('hidden');
                    
                    if (result.rows && result.rows.length > 0) {
                        debugTableHead.innerHTML = '<tr>' + result.columns.map(col => 
                            `<th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase bg-gray-100 border">${col}</th>`
                        ).join('') + '</tr>';
                        
                        debugTableBody.innerHTML = result.rows.map(row => 
                            '<tr class="border-b hover:bg-gray-50">' + result.columns.map(col => {
                                const value = row[col];
                                const displayValue = value === null ? '<span class="text-gray-400">null</span>' : value.toString();
                                return `<td class="px-4 py-2 text-sm border">${displayValue}</td>`;
                            }).join('') + '</tr>'
                        ).join('');
                    } else {
                        debugTableHead.innerHTML = '';
                        debugTableBody.innerHTML = '<tr><td class="px-4 py-8 text-center text-gray-500">查询成功，但无返回数据</td></tr>';
                    }
                } else {
                    debugMessage.innerHTML = `<i class="fa fa-times-circle mr-2"></i>${result.message}<br><br><span class="font-mono text-sm">${result.error || ''}</span>`;
                    debugMessage.className = 'mb-4 p-3 rounded-lg text-sm bg-red-50 text-red-700';
                    debugTableContainer.classList.add('hidden');
                }
            } catch (error) {
                console.error('执行SQL失败:', error);
                debugMessage.innerHTML = '<i class="fa fa-times-circle mr-2"></i>执行失败: ' + error.message;
                debugMessage.className = 'mb-4 p-3 rounded-lg text-sm bg-red-50 text-red-700';
                debugTableContainer.classList.add('hidden');
            }
        }

        function closeDebugModal() {
            document.getElementById('debugModal').classList.add('hidden');
            document.getElementById('debugSql').value = '';
            document.getElementById('debugResult').classList.add('hidden');
        }

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-blue-500', 'bg-blue-50');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-blue-500', 'bg-blue-50');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500', 'bg-blue-50');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        async function handleFile(file) {
            if (!file.name.endsWith('.sql')) {
                showResult('error', '请选择SQL文件');
                return;
            }

            document.getElementById('uploadProgress').classList.remove('hidden');
            document.getElementById('uploadResult').classList.add('hidden');
            document.getElementById('uploadFileName').textContent = file.name;
            document.getElementById('uploadPercent').textContent = '0%';
            document.getElementById('progressBar').style.width = '0%';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/sql-files/upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error('HTTP error ' + response.status);
                }
                
                const result = await response.json();
                
                document.getElementById('uploadPercent').textContent = '100%';
                document.getElementById('progressBar').style.width = '100%';
                
                setTimeout(() => {
                    if (result && result.success) {
                        const filename = result.filename || '未知文件';
                        showResult('success', `上传成功: ${filename}`);
                        loadFiles();
                    } else {
                        showResult('error', result ? result.message : '上传失败，服务器返回异常');
                    }
                }, 500);
            } catch (error) {
                console.error('上传失败:', error);
                showResult('error', '上传失败: ' + error.message);
            }
        }

        function showResult(type, message) {
            const resultDiv = document.getElementById('uploadResult');
            const resultText = document.getElementById('resultText');
            
            resultDiv.classList.remove('hidden');
            resultDiv.className = `mt-4 p-3 rounded-lg ${type === 'success' ? 'bg-green-100' : 'bg-red-100'}`;
            resultText.className = `text-sm flex items-center ${type === 'success' ? 'text-green-700' : 'text-red-700'}`;
            resultText.innerHTML = type === 'success' 
                ? `<i class="fa fa-check-circle mr-2"></i>${message}` 
                : `<i class="fa fa-times-circle mr-2"></i>${message}`;
            
            setTimeout(() => {
                resultDiv.classList.add('hidden');
            }, 3000);
        }

        async function deleteFile(filename) {
            if (!confirm(`确定要删除文件 ${filename} 吗？`)) return;
            
            try {
                const response = await fetch(`/api/sql-files/${filename}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('删除成功');
                    loadFiles();
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败');
            }
        }

        let currentEditingFile = '';

        async function editFile(filename) {
            currentEditingFile = filename;
            document.getElementById('editFilename').textContent = filename;
            
            try {
                const response = await fetch(`/api/sql-files/${filename}/content`);
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('editContent').value = result.content;
                    document.getElementById('editModal').classList.remove('hidden');
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('读取文件失败:', error);
                alert('读取文件失败');
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            document.getElementById('editContent').value = '';
            currentEditingFile = '';
        }

        async function runDebugFromEdit() {
            const content = document.getElementById('editContent').value;
            if (!content.trim()) {
                alert('内容不能为空，请先输入SQL语句');
                return;
            }
            if (!currentEditingFile) {
                alert('文件信息缺失，请重新打开编辑');
                return;
            }

            await loadDataSources();
            document.getElementById('debugSql').value = content;
            document.getElementById('debugDataSource').value = '';
            document.getElementById('debugFileName').value = currentEditingFile;
            document.getElementById('debugFileDisplay').textContent = currentEditingFile;
            document.getElementById('debugResult').classList.add('hidden');
            document.getElementById('editModal').classList.add('hidden');
            document.getElementById('debugModal').classList.remove('hidden');
        }

        async function saveFileContent() {
            const content = document.getElementById('editContent').value;
            
            if (!content.trim()) {
                alert('内容不能为空');
                return;
            }
            
            try {
                const response = await fetch(`/api/sql-files/${currentEditingFile}/content`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content: content })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('保存成功');
                    closeEditModal();
                    loadFiles();
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('保存失败:', error);
                alert('保存失败');
            }
        }

        loadFiles();
    </script>
</body>
</html>

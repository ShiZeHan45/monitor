<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL数据源维护 - 监控系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.0/dist/tailwind.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .nav-item:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }
        .status-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <div class="w-64 bg-blue-900 text-white fixed left-0 top-0 h-full">
            <div class="p-6 border-b border-blue-700">
                <h1 class="text-xl font-bold flex items-center">
                    <i class="fa fa-monitor mr-2"></i>监控系统
                </h1>
            </div>
            <nav class="p-4 space-y-2">
                <a href="/index.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                    <i class="fa fa-home mr-3"></i>首页
                </a>
                <a href="/push-records.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                    <i class="fa fa-history mr-3"></i>推送记录
                </a>
                <a href="/sql-rules.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                    <i class="fa fa-list-alt mr-3"></i>SQL规则管理
                </a>
                <a href="/sql-upload.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                    <i class="fa fa-folder-open mr-3"></i>SQL文件维护
                </a>
                <a href="/operation-logs.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                    <i class="fa fa-file-text mr-3"></i>操作记录
                </a>
                <a href="/sql-data-sources.html" class="block px-4 py-3 rounded-lg bg-blue-800 flex items-center">
                    <i class="fa fa-database mr-3"></i>SQL数据源维护
                </a>
                <a href="/remote-log-sources.html" class="block px-4 py-3 rounded-lg hover:bg-blue-800 flex items-center">
                    <i class="fa fa-cloud mr-3"></i>日志采集源维护
                </a>
            </nav>
        </div>

        <div class="ml-64 p-8 flex-1">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-800">SQL数据源维护</h2>
                <p class="text-gray-500 mt-1">管理SQL数据源配置，支持新增、编辑、删除操作</p>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center space-x-4">
                        <h3 class="text-lg font-semibold text-gray-800">数据源列表</h3>
                        <select id="envFilter" class="px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" onchange="loadDataSources()">
                            <option value="">全部环境</option>
                        </select>
                    </div>
                    <button onclick="showAddModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center">
                        <i class="fa fa-plus mr-2"></i>新增数据源
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">环境名称</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">JDBC URL</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">用户名</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">驱动类</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody id="dataSourcesBody">
                            <tr>
                                <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                                    <i class="fa fa-spinner fa-spin mr-2"></i>加载中...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="flex items-center justify-between mt-4">
                    <span class="text-sm text-gray-500">显示第 <span id="currentPage">1</span> 页，共 <span id="totalPages">1</span> 页</span>
                    <div class="flex items-center space-x-2">
                        <button onclick="prevPage()" class="px-3 py-1 text-sm border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" id="prevBtn">上一页</button>
                        <button onclick="nextPage()" class="px-3 py-1 text-sm border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" id="nextBtn">下一页</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full mx-4 max-h-[80vh] overflow-hidden">
            <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-gray-800" id="modalTitle">新增SQL数据源</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa fa-times text-xl"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto max-h-[60vh]">
                <form id="dataSourceForm">
                    <input type="hidden" id="dataSourceId">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">环境名称 *</label>
                            <select id="environmentName" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                                <option value="">请选择环境名称</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">JDBC URL *</label>
                            <input type="text" id="jdbcUrl" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required placeholder="jdbc:postgresql://host:port/database">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">用户名 *</label>
                            <input type="text" id="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">密码 *</label>
                            <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">驱动类名</label>
                            <input type="text" id="driverClassName" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="org.postgresql.Driver">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">最大连接数</label>
                                <input type="number" id="maximumPoolSize" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" min="1" placeholder="20">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">最小空闲连接</label>
                                <input type="number" id="minimumIdle" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" min="0" placeholder="5">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">最大生命周期(ms)</label>
                                <input type="number" id="maxLifetime" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" min="0" placeholder="1800000">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">连接超时(ms)</label>
                                <input type="number" id="connectionTimeout" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" min="0" placeholder="30000">
                            </div>
                        </div>
                        <div>
                            <label class="flex items-center">
                                <input type="checkbox" id="enabled" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                                <span class="ml-2 text-sm text-gray-700">启用</span>
                            </label>
                        </div>
                    </div>
                    <div class="flex justify-end space-x-4 mt-6">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                            取消
                        </button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                            保存
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;

        async function loadEnvironments() {
            try {
                const response = await fetch('/api/environments');
                const environments = await response.json();
                
                const envFilter = document.getElementById('envFilter');
                const envSelect = document.getElementById('environmentName');
                
                environments.forEach(env => {
                    const option1 = document.createElement('option');
                    option1.value = env;
                    option1.textContent = env;
                    envFilter.appendChild(option1);
                    
                    const option2 = document.createElement('option');
                    option2.value = env;
                    option2.textContent = env;
                    envSelect.appendChild(option2);
                });
            } catch (error) {
                console.error('获取环境列表失败:', error);
            }
        }

        async function loadDataSources() {
            try {
                const env = document.getElementById('envFilter').value;
                let url = `/api/sql-data-sources?page=${currentPage}&size=20`;
                if (env) url += `&environmentName=${encodeURIComponent(env)}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                const tbody = document.getElementById('dataSourcesBody');
                if (!data.records || data.records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-12 text-center text-gray-500">暂无数据源</td></tr>';
                    return;
                }
                
                totalPages = data.pages;
                document.getElementById('currentPage').textContent = currentPage;
                document.getElementById('totalPages').textContent = totalPages;
                document.getElementById('prevBtn').disabled = currentPage === 1;
                document.getElementById('nextBtn').disabled = currentPage >= totalPages;
                
                tbody.innerHTML = data.records.map(ds => {
                    const status = ds.enabled ? '启用' : '禁用';
                    const statusClass = ds.enabled ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800';
                    return `
                        <tr class="border-b border-gray-100 hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${ds.environmentName}</td>
                            <td class="px-6 py-4 text-sm text-gray-600 max-w-xs truncate" title="${ds.jdbcUrl}">${ds.jdbcUrl}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${ds.username}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${ds.driverClassName || '-'}</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="status-badge ${statusClass}">${status}</span>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <button onclick="showEditModal(${JSON.stringify(ds).replace(/"/g, '&quot;')})" class="text-blue-600 hover:text-blue-800 text-sm mr-3">
                                    <i class="fa fa-pencil mr-1"></i>编辑
                                </button>
                                <button onclick="deleteDataSource(${ds.id})" class="text-red-600 hover:text-red-800 text-sm">
                                    <i class="fa fa-trash mr-1"></i>删除
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (error) {
                console.error('获取数据源失败:', error);
                document.getElementById('dataSourcesBody').innerHTML = '<tr><td colspan="6" class="px-6 py-12 text-center text-gray-500">加载失败</td></tr>';
            }
        }

        function showAddModal() {
            document.getElementById('modalTitle').textContent = '新增SQL数据源';
            document.getElementById('dataSourceId').value = '';
            document.getElementById('environmentName').value = '';
            document.getElementById('environmentName').disabled = false;
            document.getElementById('jdbcUrl').value = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('driverClassName').value = '';
            document.getElementById('maximumPoolSize').value = '';
            document.getElementById('minimumIdle').value = '';
            document.getElementById('maxLifetime').value = '';
            document.getElementById('connectionTimeout').value = '';
            document.getElementById('enabled').checked = true;
            document.getElementById('modal').classList.remove('hidden');
        }

        function showEditModal(ds) {
            document.getElementById('modalTitle').textContent = '编辑SQL数据源';
            document.getElementById('dataSourceId').value = ds.id;
            document.getElementById('environmentName').value = ds.environmentName;
            document.getElementById('environmentName').disabled = true;
            document.getElementById('jdbcUrl').value = ds.jdbcUrl || '';
            document.getElementById('username').value = ds.username || '';
            document.getElementById('password').value = ds.password || '';
            document.getElementById('driverClassName').value = ds.driverClassName || '';
            document.getElementById('maximumPoolSize').value = ds.maximumPoolSize || '';
            document.getElementById('minimumIdle').value = ds.minimumIdle || '';
            document.getElementById('maxLifetime').value = ds.maxLifetime || '';
            document.getElementById('connectionTimeout').value = ds.connectionTimeout || '';
            document.getElementById('enabled').checked = ds.enabled || false;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        document.getElementById('dataSourceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const dataSource = {
                environmentName: document.getElementById('environmentName').value,
                jdbcUrl: document.getElementById('jdbcUrl').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                driverClassName: document.getElementById('driverClassName').value || null,
                maximumPoolSize: document.getElementById('maximumPoolSize').value ? parseInt(document.getElementById('maximumPoolSize').value) : null,
                minimumIdle: document.getElementById('minimumIdle').value ? parseInt(document.getElementById('minimumIdle').value) : null,
                maxLifetime: document.getElementById('maxLifetime').value ? parseInt(document.getElementById('maxLifetime').value) : null,
                connectionTimeout: document.getElementById('connectionTimeout').value ? parseInt(document.getElementById('connectionTimeout').value) : null,
                enabled: document.getElementById('enabled').checked
            };
            
            const id = document.getElementById('dataSourceId').value;
            
            try {
                let response;
                if (id) {
                    response = await fetch(`/api/sql-data-sources/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dataSource)
                    });
                } else {
                    response = await fetch('/api/sql-data-sources', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(dataSource)
                    });
                }
                
                const result = await response.json();
                if (result.success) {
                    closeModal();
                    loadDataSources();
                    alert(id ? '更新成功' : '添加成功');
                } else {
                    alert(result.message || '操作失败');
                }
            } catch (error) {
                console.error('保存数据源失败:', error);
                alert('保存失败');
            }
        });

        async function deleteDataSource(id) {
            if (!confirm('确定要删除这个数据源吗？')) return;
            
            try {
                const response = await fetch(`/api/sql-data-sources/${id}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                if (result.success) {
                    loadDataSources();
                    alert('删除成功');
                } else {
                    alert(result.message || '删除失败');
                }
            } catch (error) {
                console.error('删除数据源失败:', error);
                alert('删除失败');
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                loadDataSources();
            }
        }

        function nextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                loadDataSources();
            }
        }

        async function init() {
            await loadEnvironments();
            await loadDataSources();
        }
        
        init();
    </script>
</body>
</html>
